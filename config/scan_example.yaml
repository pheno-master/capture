# Static hemisphere scan of one plant (condition A).
# Run:  ros2 run capture scan --config config/scan_example.yaml
# Plan only (no robot needed):  ros2 run capture scan --config ... --plan-only

output_root: /home/jetson/scans
plant_id: plant01
notes: "synthetic plant, light tent, diffuse lighting"

views:
  center: [0.20, 0.0, 0.08]       # plant centre in base_frame (m): measure once per setup
  radius: 0.25                     # camera distance to the centre (m)
  elevations_deg: [20, 45, 70]     # 0 = side view, 90 = top-down
  views_per_ring: [12, 10, 6]
  azimuth_offset_deg: 0
  azimuth_range_deg: [0, 360]      # e.g. [-120, 120] if the arm cannot reach behind the plant
  up: [0, 0, 1]
  serpentine: true

capture:
  settle_time_s: 0.5               # wait after each motion before taking an image
  image_timeout_s: 2.0
  max_sync_dt_s: 0.05

motion:
  roll_candidates_deg: [0, 90, -90, 180]

ros:
  base_frame: base_link
  camera_frame: camera_optical_frame   # must be the OPTICAL frame (+Z forward, +Y down)
  ee_link: link6_flange                # hand–eye transform is ee_link -> camera_frame
  planning_group: arm
  image_topic: /camera/image_raw
  camera_info_topic: /camera/camera_info
  joint_states_topic: /joint_states
  tf_timeout_s: 0.5
  mover: move_group                    # or moveit_py
